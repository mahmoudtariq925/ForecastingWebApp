# STATIC demo deployment — publishes the mock-data build to the Pages ROOT.
# The live instance deploys separately (deploy-live.yml) into /live and this
# workflow must never touch it: keep_files below preserves that folder.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to push to the gh-pages branch.
permissions:
  contents: write

# Share one group with the live deploy so the two never race on gh-pages.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # Preserve everything already on the branch — most importantly the
          # /live folder the live-instance workflow publishes. (Superseded
          # asset files accumulate over time; harmless for Pages.)
          keep_files: true
